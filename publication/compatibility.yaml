# What ldap-scim-bridge provides, consumes and depends on (ADR-0020 section 3).
# The bridge serves no API: it reads LDAP and pushes users to the SCIM v2 API of
# wire-server (spar). SCIM is a standard protocol, so the link is a component
# entry, and a component entry declares presence only (range "*"): the release
# managers pick the versions when they compose a bundle.
providesApis: []

consumesApis: []

dependsOn:
  - resource: ldap
    range: "*"
    class: mandatory
    reason: >-
      The customer's directory, read over LDAP or LDAPS with a bind DN; any
      LDAPv3 server (OpenLDAP, Active Directory).
  - component: wire-server
    range: "*"
    class: mandatory
    reason: >-
      Provisions users through the SCIM v2 API of spar (/scim/v2), with a team
      SCIM token.
  - platform: kubernetes
    range: ">=1.21.0"
    class: mandatory
    reason: Matches kubeVersion in charts/ldap-scim-bridge/Chart.yaml (CronJob batch/v1).

includes: []
