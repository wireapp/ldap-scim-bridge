name: Workflows lint

# Static checks of the workflows, on every PR that touches them: actionlint
# (syntax, expressions, action inputs, and shellcheck over every `run:` block)
# and zizmor (security audit: template injection, credential persistence,
# permissions, unpinned actions).
#
# Both tools come from the nixpkgs-lint input of flake.nix, locked by
# flake.lock. Locally: `nix develop .#ci --command lint-workflows`, or
# `nix flake check`, which runs the same checks.

on:
  pull_request:
    paths:
      - ".github/actionlint.yaml"
      - ".github/workflows/**"
      - "flake.nix"
      - "flake.lock"
      - "bin/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflows-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: actionlint
        run: |
          set -euo pipefail
          nix develop .#ci --command actionlint -version
          nix develop .#ci --command actionlint -color

      # --offline: no GitHub queries (known-vulnerable actions, impostor
      # commits), so no token. Findings of medium severity and confidence or
      # above fail the job; the lower ones are reported for reading in the log.
      - name: zizmor
        run: |
          set -euo pipefail
          nix develop .#ci --command zizmor --version
          nix develop .#ci --command zizmor --offline --format github --min-severity medium --min-confidence medium .github/workflows
          echo "--- every finding, for information (does not fail the job):"
          nix develop .#ci --command zizmor --offline --format plain --no-exit-codes .github/workflows
