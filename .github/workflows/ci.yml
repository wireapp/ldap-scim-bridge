name: CI

# Lint, build and test on every pull request and on every push to the trunk
# (`dev`) and to the release branches. Images and charts are published by
# build.yml (dev builds) and by the release workflows, never from here.
on:
  pull_request:
  push:
    branches:
      - dev
      - "release/**"
  workflow_dispatch:

permissions: {}

# One run per ref. Superseded runs are cancelled on pull requests only: every
# commit of `dev` and `release/**` keeps its own result, which the release
# workflows check before preparing a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: General linting steps
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: nix flake check
        run: nix flake check

      - name: treefmt - check format
        run: nix fmt -- --ci

  build:
    name: Haskell build (GHC 9.6 - default env)
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Build
        run: nix develop --command bash -c "cabal build all"

      - name: Run tests
        run: nix develop --command bash -c "cabal test all"

      - name: Check cabal file
        run: nix develop --command bash -c "cabal check"

  helm:
    name: Helm chart
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: helm lint
        run: helm lint --strict charts/ldap-scim-bridge -f ci/helm/values-test.yaml

      - name: helm template
        run: |
          set -euo pipefail
          helm template lsb charts/ldap-scim-bridge -f ci/helm/values-test.yaml > /dev/null
          helm template lsb charts/ldap-scim-bridge --set existingSecret=lsb-config > /dev/null

      - name: openldap test chart
        run: |
          set -euo pipefail
          helm lint --strict examples/openldap
          helm template openldap examples/openldap > /dev/null

      - name: helm template fails without the required values
        run: |
          set -euo pipefail
          if helm template lsb charts/ldap-scim-bridge > /dev/null 2> "${RUNNER_TEMP}/render.err"; then
            echo "::error::rendering the chart without config should fail"
            exit 1
          fi
          grep 'is required (or set existingSecret)' "${RUNNER_TEMP}/render.err"

  # The release files of publication/ (ADR-0020 section 2) on every pull
  # request: the three files are there, the declaration is valid against the
  # wire-rm-actions schema for the version of the .cabal file (the base version
  # of the next release), the compatibility file is valid, and its Kubernetes
  # range matches the kubeVersion of the chart.
  release-files:
    name: Release files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the files and read the version
        id: files
        run: |
          set -euo pipefail
          for f in publication/release-note.md publication/declaration.json publication/compatibility.yaml; do
            [[ -s "$f" ]] || { echo "::error::$f is missing or empty"; exit 1; }
          done
          cabal_version=$(sed -n 's/^version:[[:space:]]*//p' ldap-scim-bridge.cabal)
          declared=$(jq -r '.version // ""' publication/declaration.json)
          if [[ "$declared" != "$cabal_version" ]]; then
            echo "::error::publication/declaration.json version '${declared}' differs from the .cabal version '${cabal_version}'"
            exit 1
          fi
          echo "version=${cabal_version}" >> "$GITHUB_OUTPUT"

      - name: Check the compatibility file
        uses: wireapp/wire-rm-actions/compatibility@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          file: publication/compatibility.yaml

      - name: Check the release declaration
        uses: wireapp/wire-rm-actions/release-declaration@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          file: publication/declaration.json
          component: ldap-scim-bridge
          version: ${{ steps.files.outputs.version }}

      # Chart.yaml says ">=1.21.0-0" (the -0 admits pre-release cluster
      # versions), compatibility.yaml ">=1.21.0": the same floor.
      - name: Check the Kubernetes range against the chart
        run: |
          set -euo pipefail
          chart=$(yq -r '.kubeVersion' charts/ldap-scim-bridge/Chart.yaml)
          declared=$(yq -r '.dependsOn[] | select(.platform == "kubernetes") | .range' publication/compatibility.yaml)
          if [[ "${chart%-0}" != "$declared" ]]; then
            echo "::error::compatibility.yaml kubernetes range '${declared}' does not match the chart kubeVersion '${chart}'"
            exit 1
          fi
          echo "kubernetes ${declared}: chart and compatibility.yaml agree"

  build-ghc-matrix:
    name: Haskell build with several GHC versions (some are expected to fail)
    if: contains(github.event.pull_request.labels.*.name, 'ghc-matrix')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ghc: ["ghc92", "ghc94", "ghc96", "ghc98", "ghc910"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Build
        run: nix develop ".#$GHC_VERSION" --command bash -c "cabal build all"
        env:
          GHC_VERSION: ${{ matrix.ghc }}

      - name: Run tests
        run: nix develop ".#$GHC_VERSION" --command bash -c "cabal test all"
        env:
          GHC_VERSION: ${{ matrix.ghc }}

      - name: Check cabal file
        run: nix develop ".#$GHC_VERSION" --command bash -c "cabal check"
        env:
          GHC_VERSION: ${{ matrix.ghc }}
